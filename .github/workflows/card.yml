name: Card

on:
  pull_request:
  push:
    branches:
      - main
      - hacs-integration

permissions:
  contents: read

jobs:
  card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # The committed bundle must be reproducible from source — see docs/card.md#build
      - run: npm run check:fresh
