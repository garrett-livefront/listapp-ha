name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - hacs-integration

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements_test.txt

      - run: ruff check .

      - run: ruff format --check .
